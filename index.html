<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Website</title>
    <style>
        :root {
            --navy: #071329;
            --blue: #2563eb;
            --cyan: #22d3ee;
            --violet: #8b5cf6;
            --text: #eaf2ff;
            --muted: #b9c8e3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            padding: 28px;
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
            isolation: isolate;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.18), transparent 28rem),
                radial-gradient(circle at 85% 75%, rgba(139, 92, 246, 0.24), transparent 30rem),
                linear-gradient(145deg, #050b18 0%, var(--navy) 48%, #0b1935 100%);
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            filter: blur(2px);
            animation: float 9s ease-in-out infinite;
        }

        body::before {
            width: 300px;
            height: 300px;
            top: -110px;
            right: -70px;
            border: 1px solid rgba(34, 211, 238, 0.22);
            box-shadow:
                inset 0 0 70px rgba(34, 211, 238, 0.08),
                0 0 90px rgba(37, 99, 235, 0.12);
        }

        body::after {
            width: 220px;
            height: 220px;
            bottom: -90px;
            left: -60px;
            border: 1px solid rgba(139, 92, 246, 0.25);
            box-shadow: inset 0 0 60px rgba(139, 92, 246, 0.1);
            animation-delay: -4s;
        }

        .container {
            width: min(100%, 760px);
            position: relative;
            padding: clamp(42px, 8vw, 76px) clamp(24px, 8vw, 72px);
            overflow: hidden;
            text-align: center;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.11),
                rgba(255, 255, 255, 0.045)
            );
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 28px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .container::before {
            content: "";
            width: 180px;
            height: 3px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            box-shadow: 0 0 24px rgba(34, 211, 238, 0.75);
        }

        .container::after {
            content: "";
            width: 130px;
            height: 130px;
            position: absolute;
            right: -65px;
            bottom: -65px;
            border-radius: 32px;
            transform: rotate(24deg);
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(139, 92, 246, 0.12));
        }

        h1 {
            max-width: 650px;
            margin: 0 auto 22px;
            font-size: clamp(2rem, 6vw, 3.65rem);
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -0.045em;
            text-wrap: balance;
            background: linear-gradient(105deg, #ffffff 12%, #a5f3fc 52%, #c4b5fd 92%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h2 {
            margin-bottom: 28px;
            color: #dbeafe;
            font-size: clamp(1.05rem, 3vw, 1.35rem);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        span {
            display: inline-block;
            margin-left: 0.2em;
            color: #67e8f9;
            font-weight: 750;
            text-shadow: 0 0 24px rgba(34, 211, 238, 0.4);
        }

        p {
            max-width: 590px;
            margin: 0 auto;
            color: var(--muted);
            font-size: clamp(0.98rem, 2.5vw, 1.12rem);
            line-height: 1.75;
            text-wrap: balance;
        }

        strong {
            color: #eef6ff;
            font-weight: 650;
        }

        @keyframes float {
            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }
            50% {
                transform: translate3d(0, 14px, 0);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 18px;
            }

            .container {
                border-radius: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before,
            body::after {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 Welcome to the Devops World.</h1>

        <h2>Hosted by <span>Ubuntu V6.</span></h2>

        <p>
            This website is hosted on <strong>Private EC2 server using Jenkins for CI/CD Pipeline.</strong>.
        </p>

    </div>

</body>
</html>
